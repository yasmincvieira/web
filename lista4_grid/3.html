<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questao 3</title>
    <style>
        *{
            margin: 1%;
            padding: 1%;
            border-radius: 5%;
        }
        .container{
            display: grid;
            grid-template-areas: "A A . B" 
                                "C S S S"
                                ;
            grid-template-rows: 100px 1fr;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }
        #boxs{
            display: grid;
            grid-template-areas: "E F G" 
                                "M I J";
            grid-template-rows: 100px 1fr;
            grid-template-columns: 1fr 1fr 1fr;
        }
        .box{
            margin: 2;
            padding: 2px;
        }
        #boxA{
            grid-area: A;
            background-color: gray;
        }
        #boxB{
            grid-area: B;
            background-color: gray;
        }
        #boxC{
            grid-area: C;
            background-color: gray;
        }
        #boxs{
            grid-area: S;
            background-color: gray;
        }
        #boxE{
            grid-area: E;
            background-color: lightgray;
        }#boxF{
            grid-area: F;
            background-color: lightgray;
        }#boxG{
            grid-area: G;
            background-color: lightgray;
        }#boxM{
            grid-area: M;
            background-color: lightgray;
        }#boxI{
            grid-area: I;
            background-color: lightgray;
        }#boxJ{
            grid-area: J;
            background-color: lightgray;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="boxA">A</div>
        <div id="boxB">B</div>
        <div id="boxC">C</div>
        <div id="boxs">
            <div id="boxE">E</div>
            <div id="boxF">F</div>
            <div id="boxG">G</div>
            <div id="boxM">M</div>
            <div id="boxI">I</div>
            <div id="boxJ">J</div>
        </div>
    </div>
    
</body>
</html>
