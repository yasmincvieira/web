<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 2</title>
    <style>
        .container{
            display: grid;
            grid-template-areas: "header header" 
                                "nav contenti"
                                "nav footer";
            grid-template-rows: 100px 1fr 100px;
            grid-template-columns: 150px 1fr;
            height: 100vh;
        }
        .box{
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: larger;
            
        }
        #box1{grid-area: header; 
            background-color: rgba(255, 20, 145, 0.683);
        }
        #box2{grid-area: nav; 
            background-color: rgba(128, 128, 0, 0.626);
        }
        #box3{grid-area: contenti; 
            background-color: rgba(255, 160, 122, 0.605);
        }
        #box4{grid-area: footer; 
            background-color: rgba(127, 255, 212, 0.676);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1"><strong>Header</strong></div>
        <div class="box" id="box2"><strong>Nav</strong></div>
        <div class="box" id="box3"><strong>Content</strong></div>
        <div class="box" id="box4"><strong>Footer</strong></div>
    </div>
    
</body>
</html>
