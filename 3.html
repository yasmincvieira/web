<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questao 3</title>
    <style>
        .container{
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-direction: row;
        }
        #franca{
            display: flex;
            border: 1px solid black;
            width: 150px;
            height: 90px;
            flex-direction: row;
        }
        #Faixa1{
            background-color: blue;
            border: 1px solid blue;
            justify-content: start;
            width: 50px;
            height: 89px;
        }
        #Faixa2{
            background-color: white;
            border: 1px solid white;
            justify-content: center;
            width: 50px;
            height: 89px;
        }
        #Faixa3{
            background-color: red;
            border: 1px solid red;
            justify-content: end;
            width: 50px;
            height: 89px;
        }

        #alemanha{
            display: flex;
            border: 1px solid black;
            width: 150px;
            height: 90px;
            flex-direction: column;
        }
        #Afaixa1{
            background-color: black;
            border: 1px solid black;
            justify-content: start;
            width: 149px;
            height: 30px;
        }
        #Afaixa2{
            background-color: red;
            border: 1px solid red;
            justify-content: center;
            width: 149px;
            height: 30px;
        }
        #Afaixa3{
            background-color: yellow;
            border: 1px solid yellow;
            justify-content: end;
            width: 149px;
            height: 30px;
        }

        #japao{
            display: flex;
            border: 1px solid black;
            width: 150px;
            height: 90px;
            align-items: center;
            justify-content: center;
        }
        #bola{
            background-color: red;
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="bandeira" id="franca">
            <div id="Faixa1"></div>
            <div id="Faixa2"></div>
            <div id="Faixa3"></div>
        </div>
        <div class="bandeira" id="alemanha">
            <div id="Afaixa1"></div>
            <div id="Afaixa2"></div>
            <div id="Afaixa3"></div>
        </div>
        <div class="bandeira" id="japao">
            <div id="bola"></div>
        </div>
    </div>
    
    
</body>
</html>
