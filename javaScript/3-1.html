<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 3-1</title>
    <style>
        #divsoma{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #controlesoma{
            display: flex;
            justify-content: flex-end;
        }
        
    </style>
</head>
<body>
    <h1>Soma de números na interface</h1>
    <div id="divsoma">
        <div>
            <label for="entradaA">A</label>
            <input type="number" name="" id="entradaA">
            <span>+</span>
            <label for="entradaB">B</label>
            <input type="number" name="" id="entradaB">
            <span>=</span>
            <span id="resultado"></span><br><br>
        </div>
        <div id="controlesoma">
            <input type="button" value="somar" id="btn">
        </div>
    </div>

    <script>
        let a,b;
        let inputA = document.querySelector("#entradaA");
        let inputB = document.querySelector("#entradaB");
        let button = document.getElementById("btn")

        function soma(a,b){
            return a+b
        }
        button.addEventListener("click", ()=>{
            a=Number(inputA.value)
            b=Number(inputB.value)
            soma = a+b;
            let spanResultado=document.querySelector("#resultado")
            spanResultado.innerHTML=soma

        })


        a=Number(inputA.value)
        b=Number(inputB.value)
        soma = a+b;
        let spanResultado=document.querySelector("#resultado")
        spanResultado.innerHTML=soma

    </script>
</body>
</html>
