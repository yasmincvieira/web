<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Layout</title>
    <style>
        body {
            background: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .tela {
            width: 300px;
            height: 500px;
            background: white;
            border: 3px solid gray;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: lightgray;
            margin-bottom: 20px;
        }

        .linhas {
            width: 100%;
        }

        .linha {
            height: 15px;
            background: lightgray;
            border-radius: 5px;
            margin: 10px 0;
        }

        .bola {
            width: 70px;
            height: 70px;
            background: lightgray;
            border-radius: 50%;
            
        }

        .botao {
            width: 120px;
            height: 15px;
            background: lightgrey;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="tela">
        <div class="logo">Company Logo</div>

        <div class="linhas">
            <div class="linha"></div>
            <div class="linha"></div>
            <div class="linha"></div>
            <div class="linha"></div>
        </div>

        <div>
            <div class="bola"></div>
            <div class="botao"></div>
        </div>
    </div>

</body>
</html>
