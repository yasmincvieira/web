<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        body {
            background-color: gainsboro;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: mediumturquoise;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: cadetblue;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid lightgray;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: mediumaquamarine;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }
        .resultado-container {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid white;
        }
        #resultadoIMC {
            font-size: 1.5rem;
            font-weight: bold;
            color: mediumaquamarine;
            margin: 10px;
        }
        #classificacao {
            font-size: 25px;
            color: gray;
            margin: 10px;
        }
        #imgPerfil {
            max-width: 150px;
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora de IMC</h1>
        
        <div class="input-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Seu nome">
        </div>

        <div class="input-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 75.5">
        </div>

        <div class="input-group">
            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
        </div>

        <button onclick="calcularIMC()">Calcular</button>

        <div class="resultado-container">
            <p id="resultadoIMC"></p>
            <p id="classificacao"></p>
            <img id="imgPerfil" alt="Perfil de Saúde">
        </div>
    </div>

    <script>
        function calcularIMC() {
            const nomeInput = document.getElementById('nome');
            const pesoInput = document.getElementById('peso');
            const alturaInput = document.getElementById('altura');
            const resultadoIMC = document.getElementById('resultadoIMC');
            const classificacaoTxt = document.getElementById('classificacao');
            const imgPerfil = document.getElementById('imgPerfil');

            if (nomeInput.value !== "" && pesoInput.value !== "" && alturaInput.value !== "") { 
                const peso = parseFloat(pesoInput.value);
                const altura = parseFloat(alturaInput.value);
                const imc = peso / (altura * altura);
                
                let classificacao = "";
                let imgSource = "";

                if (imc < 18.5) {
                    classificacao = "Abaixo do peso";
                } else if (imc < 25) {
                    classificacao = "Peso normal";
                } else if (imc < 30) {
                    classificacao = "Sobrepeso";
                } else if (imc < 35) {
                    classificacao = "Obesidade grau 1";
                } else if (imc < 40) {
                    classificacao = "Obesidade grau 2";
                } else {
                    classificacao = "Obesidade grau 3 (mórbida)";
                }

                resultadoIMC.textContent = `${nomeInput.value}, seu IMC é: ${imc.toFixed(2)}`;
                classificacaoTxt.textContent = `Classificação: ${classificacao}`;

                const imcArredondado = Math.floor(imc);

                function InserirImagem(url) {
                    let img = document.createElement("img");
                    img.src=url;
                    document.body.appendChild(img);
                }
                
                switch (true) {
                    case (imcArredondado < 18):
                        img.src="ppi1_lista_js/imgs_js/abaixopeso.png";
                        break;
                    case (imcArredondado >= 18 && imcArredondado < 25):
                        imgSource = "normal.png";
                        break;
                    case (imcArredondado >= 25 && imcArredondado < 30):
                        imgSource = "sobrepeso.png";
                        break;
                    case (imcArredondado >= 30 &&imcArredondado < 35):
                        imgSource = "obesidade1.png";
                        break;
                    case (imcArredondado >= 35 && imcArredondado < 40):
                        imgSource = "obesidade2.png";
                        break;
                    case (imcArredondado >= 40):
                        imgSource = "obesidade3.png";
                        break;
                    default:
                        imgSource = "perfil.jpg";
                }

                imgPerfil.src = imgSource;
                imgPerfil.style.display = "inline-block";

            } else {
                alert("Por favor, preencha todos os campos!");
            }
        }
    </script>

</body>
</html>
